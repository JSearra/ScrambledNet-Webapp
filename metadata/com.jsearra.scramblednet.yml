Name: Scrambled Net
Summary: Connect the terminals to the server
Description: |-
  Scrambled Net is a simple puzzle game which requires you to sort out the connections in a computer network, so that all the terminals are connected to the server. The network is made up of tiles, and while all the tiles are in the right place, they have been rotated randomly into a useless mess.

  You need to rotate individual tiles to re-connect the network. Tiles which are connected to the server are shown highlighted. When all terminals are connected, you've won.

  Features:
  * Multiple difficulty levels (Novice to Insane)
  * Retro and Modern themes
  * Sound effects

RepoType: git
Repo: https://github.com/JSearra/ScrambledNet-Webapp.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 6f738a9d15024227ce206253c65c2763de421256
    subdir: android/app
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y nodejs npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm install
      - npm run build
      - npx cap sync android
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
