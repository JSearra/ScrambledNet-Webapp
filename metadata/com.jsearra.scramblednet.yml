Builds:
  - versionName: 1.2.0
    versionCode: 4
    commit: v1.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm install --build-from-source
      - npm run build
      - npx cap sync android
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules

