Builds:
  - versionName: 1.3.1
    versionCode: 6
    commit: 9712eb763cb1501539ee99105c521ead65121cdf
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm_config_build_from_source=true npm install
      - npm run build
      - npx cap sync android
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules

